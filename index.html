<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ПАДЕНИЕ: НИЖЕ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.wrap{position:relative;width:100vw;height:100vh;max-width:1280px;max-height:720px;background:#0b0f18;overflow:hidden;box-shadow:0 0 80px #000}.top{position:absolute;z-index:5;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#111827cc;border:1px solid #ffffff18;border-radius:14px;padding:8px 12px;font-size:13px;backdrop-filter:blur(8px)}canvas{display:block;width:100%;height:100%}.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#18233dcc,#05070bcc 70%);padding:24px}.panel{width:min(520px,94vw);padding:34px;border:1px solid #ffffff18;border-radius:28px;background:#0f1522eF;box-shadow:0 20px 80px #0008;text-align:center}.logo{font-size:clamp(38px,7vw,72px);font-weight:900;letter-spacing:-.06em;line-height:.9}.sub{margin:14px 0 26px;color:#9ca9bc}.btn{appearance:none;border:0;border-radius:15px;padding:14px 20px;background:#8b5cf6;color:white;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 30px #8b5cf655}.btn:hover{filter:brightness(1.1)}.small{font-size:12px;color:#6f7d91;margin-top:18px}.hidden{display:none}.touch{position:absolute;z-index:6;bottom:18px;left:18px;right:18px;display:none;justify-content:space-between;pointer-events:none}.touch .cluster{display:flex;gap:10px}.touch button{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff20;background:#111827aa;color:#fff;font-size:22px;font-weight:800}.touch button:active{transform:scale(.94);background:#8b5cf6aa}@media(max-width:800px),(pointer:coarse){.touch{display:flex}.top{top:8px}.panel{padding:28px 22px}}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game"></canvas>
<div class="top"><div class="pill" id="level">Уровень 1</div><div class="pill" id="stats">💎 0 &nbsp; • &nbsp; Рекорд 0</div></div>
<div class="touch"><div class="cluster"><button data-key="left">←</button><button data-key="right">→</button></div><div class="cluster"><button data-key="jump">↑</button></div></div>
<div class="screen" id="menu"><div class="panel"><div class="logo">ПАДЕНИЕ<br><span style="color:#8b5cf6">НИЖЕ</span></div><div class="sub">Платформер, где безопасные платформы долго не живут.</div><button class="btn" id="start">НАЧАТЬ</button><div class="small">A / D или ← / → — движение · W / ↑ / Space — прыжок</div></div></div>
<div class="screen hidden" id="over"><div class="panel"><div class="logo" style="font-size:44px">ТЫ УПАЛ</div><div class="sub" id="overText">Собрано: 0</div><button class="btn" id="retry">ПОВТОРИТЬ</button><div class="small">Попробуй пройти быстрее и собрать больше осколков.</div></div></div>
<div class="screen hidden" id="win"><div class="panel"><div class="logo" style="font-size:44px">УРОВЕНЬ ПРОЙДЕН</div><div class="sub" id="winText">Время: 0.0 сек</div><button class="btn" id="next">ДАЛЬШЕ</button></div></div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,scale=1;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=devicePixelRatio;ctx.setTransform(scale,0,0,scale,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const keys={left:false,right:false,jump:false};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(['ArrowUp',' ','w'].includes(e.key))keys.jump=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(['ArrowUp',' ','w'].includes(e.key))keys.jump=false});
document.querySelectorAll('.touch button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
let levelNo=1,score=0,best=+localStorage.getItem('fallBest')||0,running=false,dead=false,won=false,startTime=0,last=0,particles=[];
const player={x:80,y:0,w:25,h:34,vx:0,vy:0,onGround:false,jumps:0};let platforms=[],gems=[],exit={x:0,y:0,w:36,h:56};
function makeLevel(n){platforms=[];gems=[];const count=13+n*2;let x=-80,y=H*.70;platforms.push({x,y,w:360,h:24,kind:0,drop:0});for(let i=1;i<count;i++){x+=120+Math.random()*120;y=Math.max(100,Math.min(H-100,y+(Math.random()-.5)*150));platforms.push({x,y,w:100+Math.random()*90,h:20,kind:i%4===0?1:0,drop:0});if(Math.random()<.8)gems.push({x:x+45,y:y-32,r:7,t:Math.random()*7});}exit={x:x+35,y:y-60,w:32,h:60};player.x=60;player.y=platforms[0].y-player.h-2;player.vx=player.vy=0;player.jumps=0;score=0;startTime=performance.now();}
function spawn(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,a:1,r:2+Math.random()*3,c:Math.random()<.5?'#8b5cf6':'#dbeafe'})}
function reset(){dead=won=false;document.getElementById('over').classList.add('hidden');document.getElementById('win').classList.add('hidden');makeLevel(levelNo);running=true;}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(!running)return;const speed=330,grav=1550;player.vx+=(keys.right?speed:0)-(keys.left?speed:0);player.vx*=Math.pow(.001,dt);player.vx=Math.max(-260,Math.min(260,player.vx));if(keys.jump&&player.jumps<2){player.vy=-620;player.jumps++;keys.jump=false;spawn(player.x+player.w/2,player.y+player.h,5)}player.vy+=grav*dt;let oldY=player.y;player.x+=player.vx*dt;player.y+=player.vy*dt;player.onGround=false;
for(const p of platforms){if(p.drop>0)p.drop-=dt;if(p.drop>0)continue;if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y){player.y=p.y-player.h;player.vy=0;player.onGround=true;player.jumps=0;if(p.kind){p.drop=.35}}}
for(const g of gems){g.t+=dt;if(!g.got&&Math.hypot(player.x+player.w/2-g.x,player.y+player.h/2-g.y)<25){g.got=true;score++;spawn(g.x,g.y,10)}}
if(rectHit(player,exit)){won=true;running=false;spawn(exit.x,exit.y,25);document.getElementById('winText').textContent='Осколки: '+score+' · Время: '+((performance.now()-startTime)/1000).toFixed(1)+' сек';document.getElementById('win').classList.remove('hidden');}
if(player.y>H+100||player.x<-300){dead=true;running=false;best=Math.max(best,score);localStorage.setItem('fallBest',best);document.getElementById('overText').textContent='Осколки: '+score+' · Рекорд: '+best;document.getElementById('over').classList.remove('hidden');}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=400*dt;p.a-=dt*1.8});particles=particles.filter(p=>p.a>0);document.getElementById('stats').innerHTML='💎 '+score+' &nbsp; • &nbsp; Рекорд '+best;document.getElementById('level').textContent='Уровень '+levelNo;
}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#080b15');bg.addColorStop(1,'#151126');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// stars
for(let i=0;i<70;i++){let x=(i*97)%W,y=(i*53)%H;ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1;
const camX=Math.max(0,player.x-W*.3);ctx.save();ctx.translate(-camX,0);
for(const p of platforms){if(p.drop>0)ctx.globalAlpha=Math.max(0,p.drop/.35);ctx.fillStyle=p.kind?'#4c3a70':'#222b3d';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle=p.kind?'#a78bfa':'#64748b';ctx.fillRect(p.x,p.y,p.w,3);ctx.globalAlpha=1}
for(const g of gems)if(!g.got){ctx.save();ctx.translate(g.x,g.y+Math.sin(g.t*4)*3);ctx.rotate(Math.PI/4);ctx.fillStyle='#c4b5fd';ctx.shadowBlur=18;ctx.shadowColor='#8b5cf6';ctx.fillRect(-7,-7,14,14);ctx.restore()}
ctx.fillStyle='#8b5cf6';ctx.fillRect(exit.x,exit.y,exit.w,exit.h);ctx.fillStyle='#e9d5ff';ctx.fillRect(exit.x+8,exit.y+8,16,4);ctx.fillStyle='#0b0f18';ctx.fillRect(exit.x+9,exit.y+20,14,25);
ctx.fillStyle='#e2e8f0';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#8b5cf6';ctx.fillRect(player.x,player.y,player.w,7);ctx.fillStyle='#111827';ctx.fillRect(player.x+6,player.y+10,4,5);ctx.fillRect(player.x+16,player.y+10,4,5);
for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore();}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=()=>reset();document.getElementById('retry').onclick=()=>reset();document.getElementById('next').onclick=()=>{levelNo++;document.getElementById('win').classList.add('hidden');reset()};
// Optional Yandex Games bridge. It activates only after deployment with the Yandex SDK available.
window.YandexBridge={ysdk:null,init:async function(){if(window.YaGames){this.ysdk=await YaGames.init();}},showAd:async function(){try{if(this.ysdk)await this.ysdk.adv.showFullscreenAdv({callbacks:{}})}catch(e){}}};
</script>
</body></html>
